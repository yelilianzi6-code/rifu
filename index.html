<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日腐直通车</title>
  <link rel="stylesheet" href="style.css?v=20261013b" />
</head>
<body data-page="home">
  <div id="topnav"></div>

  <header class="site-header">
    <h1>日腐直通车</h1>
    <p class="subtitle">正在更新的日腐剧 / 电影，一眼直达</p>
  </header>

  <main>
    <section class="section search-section">
      <input id="search-input" class="search-input" type="search"
        placeholder="搜剧名 / 主演（范围：我的评分 + 我的待看）" autocomplete="off" />
      <div id="search-results" class="search-results"></div>
    </section>

    <section class="section">
      <h2 class="section-title">正在热播</h2>
      <div id="carousel" class="carousel"></div>
    </section>

    <section class="section">
      <h2 class="section-title">快速直达</h2>
      <div class="jump-grid">
        <a class="jump-card" href="schedule.html">
          <span class="jump-icon">📅</span>
          <span class="jump-label">每周更新日程表</span>
          <span class="jump-sub">几点更新，一目了然</span>
        </a>
        <a class="jump-card" href="upcoming.html">
          <span class="jump-icon">🎬</span>
          <span class="jump-label">已定档待播</span>
          <span class="jump-sub">未上线的剧 / 电影</span>
        </a>
        <a class="jump-card" href="reviews.html">
          <span class="jump-icon">⭐</span>
          <span class="jump-label">我的评分</span>
          <span class="jump-sub">看过的日腐打分</span>
        </a>
        <a class="jump-card" href="watchlist.html">
          <span class="jump-icon">🔖</span>
          <span class="jump-label">我的待看</span>
          <span class="jump-sub">还没看的清单</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>数据每日自动更新 · 信息来自日本官方 / 资讯站，仅供参考，以官方为准</p>
  </footer>

  <script src="app.js?v=20261013b"></script>
</body>
</html>
