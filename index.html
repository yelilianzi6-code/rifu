<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日腐追更日程表</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>日腐追更日程表</h1>
    <p class="subtitle">每周几号 · 几点更新，一目了然</p>
    <p class="updated" id="updated-at"></p>
  </header>

  <main>
    <section class="section">
      <h2 class="section-title">连载中 · 本周日程</h2>
      <div id="schedule" class="schedule"></div>
    </section>

    <section class="section">
      <h2 class="section-title">待播 · 未上线</h2>
      <div id="upcoming" class="card-list"></div>
    </section>

    <section class="section">
      <h2 class="section-title">已完结</h2>
      <div id="ended" class="card-list"></div>
    </section>

    <section class="section">
      <h2 class="section-title">上新资讯</h2>
      <div id="news" class="news-feed"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>数据每日自动更新 · 信息来自日本官方/资讯站，仅供参考，以官方为准</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
